name: Remove Manual Food Selection

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'# ---------------------------------------------------\n'
              r'# FOOD SELECTION\n'
              r'# ---------------------------------------------------.*?'
              r'# ---------------------------------------------------\n'
              r'# GET FOOD DATA\n'
              r'# ---------------------------------------------------',
              re.S,
          )

          replacement = '''# ---------------------------------------------------
# AI RECOGNITION → DATABASE MATCH
# ---------------------------------------------------

CONFIDENCE_THRESHOLD = 70.0

foods["food_key"] = (
    foods["English"]
    .astype(str)
    .str.strip()
    .str.lower()
)

selected_food = None
ai_match = None

if ai_food is not None:
    ai_key = ai_food.strip().lower()
    ai_match = foods[foods["food_key"] == ai_key]

    if ai_confidence >= CONFIDENCE_THRESHOLD and len(ai_match) > 0:
        st.success(f"✅ High-confidence match found: **{ai_food}**")
        selected_food = ai_match.iloc[0]["English"]
    elif ai_confidence >= CONFIDENCE_THRESHOLD:
        st.warning(
            f"⚠️ **{ai_food}** was recognized with {ai_confidence:.2f}% confidence, "
            "but it is not available in the NutriGuard nutrition database."
        )
    else:
        st.warning(
            f"⚠️ Recognition confidence is only {ai_confidence:.2f}%. "
            "Please upload a clearer image."
        )
else:
    st.info("📷 Upload a meal image above to identify and analyze the food.")

if selected_food is None:
    st.stop()

# ---------------------------------------------------
# GET FOOD DATA
# ---------------------------------------------------'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Target manual food-selection block was not found.')

          path.write_text(updated, encoding='utf-8')
          print('Manual food selection removed.')
          PY

      - name: Commit app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then
            echo 'No app change required.'
            exit 0
          fi
          git commit -m 'feat: use AI food recognition as meal selection'
          git push
